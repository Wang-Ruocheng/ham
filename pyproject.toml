[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recurrent-rg"
version = "0.1.0"
description = "A minimal recurrent renormalization-group network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "numba>=0.57",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
recurrent-rg = "recurrent_rg.cli:main"

[tool.setuptools.packages.find]
include = ["recurrent_rg*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
